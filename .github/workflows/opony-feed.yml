# Ceny opon z feedu Awin (tanie-opony.pl) → data/opony → strona /dobor-opon/.
# Codziennie rano i przyciskiem: GitHub → Actions → „Ceny opon” → Run workflow.
# Adres feedu jest w sekrecie AWIN_FEED_OPONY (Settings → Secrets and variables → Actions).
# Gdy feed nie odpowiada albo jest podejrzanie mały, automat kończy się na czerwono, a strona zostaje z poprzednimi cenami.
name: Ceny opon

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: write

concurrency:
  group: opony-feed
  cancel-in-progress: false

jobs:
  opony:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pobierz feed i przygotuj dane
        env:
          AWIN_FEED_OPONY: ${{ secrets.AWIN_FEED_OPONY }}
        run: python3 scripts/opony-feed.py
      - name: Zapisz na stronie
        run: |
          git config user.name "Ceny opon"
          git config user.email "actions@users.noreply.github.com"
          git add data/opony
          if git diff --cached --quiet; then
            echo "Ceny bez zmian."
          else
            git commit -m "Ceny opon $(date +%F)"
            git pull --rebase
            git push
          fi
